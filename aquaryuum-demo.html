$('#adopt').onclick=()=>modal('<h2>金魚をお迎え</h2><p>ひとり3匹まで。あとから同じチャットのみんなと交流できます。</p><label>名前（12文字まで）<input id="name" maxlength="12" placeholder="例：こはく"></label><label>金魚の種類<select id="breed"><option>和金</option><option>琉金</option><option>出目金</option></select></label><button id="welcome">この子をお迎えする</button>');
$('#help').onclick=()=>modal('<h2>水槽のある暮らし</h2><p>餌やりでお腹を満たし、部分換水で水をきれいに。水草を整えたり、そっと眺めたりするとごきげんになります。同じお世話は金魚ごとに5分に1回、経験値になります。</p><p>ほかの参加者の金魚と一緒に泳ぐと、お互いのごきげんと経験値が上がります。レベル2で若い金魚、レベル5で立派な金魚に育ちます。</p><p>友だちの金魚に「プレゼントを贈る」から手紙・金魚の餌・水草・水槽の飾りを贈れます。手紙は300文字まで。贈り物は金魚ごとに5分ごとで、「プレゼントの記録」に残ります。手紙も同じチャットのみんなに共有されます。</p><p>時間がたつと状態は少しずつ下がりますが、金魚はいなくなりません。操作は共有の受信後に画面へ反映されます。</p><p>新しい版へ移る前に「引き継ぎ」でJSONを保存してください。バックアップには全員の金魚・名前・お世話・交流・プレゼントと手紙・所有者の記録が含まれ、読み込むとチャット内に共有されます。信頼できる同じメンバーで使ってください。これはゲームです。実際の飼育方法とは異なります。</p>');
function transfer(){pending=null;modal('<h2>記録を保存・引き継ぎ</h2><p>新版でも、アクアリュウム形式1のJSONを読み込めます。金魚の名前と持ち主を確認してください。全員の記録が共有されます。</p><button id="export">JSONを書き出す</button><p>保存先のチャットで添付ファイルを実際に送信してください。</p><button id="import">バックアップを選ぶ</button><input id="file" type="file" accept=".json,application/json" hidden><div id="preview"></div><p id="transfer-status" class="progress"></p>')}
$('#transfer').onclick=transfer;
async function readFile(file){if(!file)return;if(file.size>A.MAX)throw Error('ファイルは2MBまでです。');const d=A.validate(JSON.parse(await file.text()));storeCheck(d.events);pending=d;const s=A.state([...store.log,...d.events]),owners=new Map();for(const f of s.fish)owners.set(f.owner,[...(owners.get(f.owner)||[]),f]);$('#preview').innerHTML=`<p>${d.events.length}件の履歴。今の記録に追加します。</p><label>以前の自分の金魚<select id="owner"><option value="">記録だけ読み込む</option>${[...owners].map(([o,fs])=>`<option value="${esc(o)}">${esc(fs[0].on)}：${esc(fs.map(f=>f.name).join('・'))}${o===me?'（あなた）':''}</option>`).join('')}</select></label><p>ほかの人も、自分の端末で自分の金魚を選んで引き継ぎます。</p><button id="restore">この内容で引き継ぐ</button>`}
function storeCheck(es){const check=new A.Store();check.merge(store.log);check.merge(es);return check}
document.addEventListener('change',e=>{if(e.target.id==='file')run(()=>readFile(e.target.files[0]))});
document.addEventListener('click',e=>run(async()=>{const b=e.target.closest('button');if(!b||busy)return;const id=b.id;if(id==='welcome'){const name=$('#name').value.trim();if(!name)throw Error('名前を入力してください。');await sendEvents([event({a:'adopt',id:uid(),name,breed:$('#breed').value,on:String(W.selfName||'あなた').slice(0,40)})]);dlg.close()}
if(b.dataset.action){const f=A.state(store.log).fish.find(f=>f.id===b.dataset.id);if(!f||f.owner!==me)return;if(Date.now()-(f.last[b.dataset.action]??0)<300000)throw Error('このお世話は5分あけてからどうぞ。');await sendEvents([event({a:b.dataset.action,id:f.id})])}
if(b.dataset.gift){const mine=A.state(store.log).fish.filter(f=>f.owner===me);modal(`<h2>プレゼントを贈る</h2><p>相手の金魚に贈ります。手紙やメッセージは同じチャットのみんなが読めます。</p><label>贈るあなたの金魚<select id="gift-from">${mine.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label><label>プレゼント<select id="gift-kind">${Object.entries(giftKinds).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>メッセージ（300文字まで）<textarea id="gift-text" maxlength="300" rows="4" placeholder="手紙を選んだときは本文を入力してください"></textarea></label><button id="send-gift" data-to="${b.dataset.gift}">このプレゼントを贈る</button>`)}
if(id==='send-gift'){const f=A.state(store.log).fish.find(f=>f.id===$('#gift-from').value),kind=$('#gift-kind').value,text=$('#gift-text').value.trim();if(!f||f.owner!==me)throw Error('あなたの金魚を選んでください。');if(kind==='letter'&&!text)throw Error('手紙の本文を入力してください。');if(Date.now()-(f.last.gift??0)<300000)throw Error('プレゼントは金魚ごとに5分あけてからどうぞ。');await sendEvents([event({a:'gift',id:f.id,to:b.dataset.to,kind,text})]);dlg.close()}
if(b.dataset.visit){const mine=A.state(store.log).fish.filter(f=>f.owner===me);modal(`<h2>一緒に泳ぐ</h2><label>あなたの金魚<select id="from">${mine.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label><button id="swim" data-to="${b.dataset.visit}">水槽で交流する</button>`)}
if(id==='swim'){const f=A.state(store.log).fish.find(f=>f.id===$('#from').value);if(Date.now()-(f.last.swim??0)<300000)throw Error('一緒に泳ぐのは5分あけてからどうぞ。');await sendEvents([event({a:'swim',id:f.id,to:b.dataset.to})]);dlg.close()}
if(id==='export'){if(!W.sendToChat)throw Error('書き出しに対応したDelta Chatへ更新してください。');const d=store.backup(me);A.validate(d);$('#transfer-status').textContent='添付の送信画面でJSONを送信し、残してください。';await W.sendToChat({file:{name:'aquaryuum-backup-'+Date.now()+'.json',plainText:JSON.stringify(d)},text:'アクアリュウムの引き継ぎバックアップ'})}
if(id==='import'){if(W.importFiles){const files=await W.importFiles({extensions:['.json'],mimeTypes:['application/json'],multiple:false});await readFile(files[0])}else $('#file').click()}
if(id==='restore'&&pending){A.validate(pending);const check=storeCheck(pending.events),chosen=$('#owner').value,es=pending.events.filter(e=>!store.events.has(e.k));if(chosen){const s=A.state(check.log),owner=A.resolve(chosen,s.owners);if(owner!==me){const ids=new Set(s.fish.filter(f=>f.owner===me||f.owner===owner).map(f=>f.id));if(ids.size>3)throw Error('引き継ぐと3匹を超えます。お迎え前の新しいアプリで引き継いでください。');es.push(event({a:'claim',source:owner,target:me}))}}if(es.length)await sendEvents(es);$('#transfer-status').textContent=es.length?'引き継ぎを送信しました。水槽で受信結果を確認してください。':'すでに取り込み済みです。記録は重複しません。';pending=null;$('#preview').innerHTML=''}
}));
if(!W||!W.sendUpdate||!W.setUpdateListener){status('共有機能を読み込めません。Delta Chatのアプリメッセージから開き直してください。');document.querySelectorAll('button').forEach(b=>b.disabled=true)}else{W.setUpdateListener(u=>{try{if(u.payload?.app!==A.FORMAT)return;store.merge(u.payload.events);render();if(ready)status('共有記録を受信しました。')}catch(e){status('共有記録を反映できません：'+e.message)}},0).then(()=>{ready=true;render();status('共有記録の読み込みが完了しました。')}).catch(e=>status('共有機能の初期化に失敗しました：'+e.message))}render();setInterval(render,30000);

</script></body></html>
